[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "docpulse"
version = "0.1.0"
description = "DocPulse-RAG: 文档脉冲检索增强系统"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "markdown-it-py>=3.0",
    "mdit-py-plugins>=0.4",
    "GitPython>=3.1",
    "httpx>=0.27",
    "openai>=1.40",
    "chromadb>=0.5",
    "rank-bm25>=0.2",
    "sentence-transformers>=3.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-dotenv>=1.0",
]

[project.scripts]
docpulse = "docpulse.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/docpulse"]

[tool.hatch.build]
sources = ["src"]
